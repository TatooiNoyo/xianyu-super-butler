# 构建并发布 Docker 镜像到 GitHub Container Registry (ghcr.io)
#
# 为什么需要这个：NAS、软路由这类设备上本地 `docker compose build` 要跑
# npm ci + vite build + pip 编译 + 下载 Chromium，CPU 会长时间打满，
# 内存不够时直接 OOM，表现为"部署不上、机器卡死"。
# 有了预构建镜像，这些设备只需要 pull，几分钟就能起来。
#
# 发布后镜像地址：ghcr.io/<owner>/xianyu-super-butler:latest
# 首次发布后需要到仓库 Packages 页面把镜像设为 Public，否则 pull 需要登录。

name: Publish Docker image

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}

    steps:
      - name: Normalize image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch }}

  build:
    name: Build linux/${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 每种架构使用原生 runner，避免 QEMU 模拟安装依赖和编译。
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 先按 digest 推送；两种架构都成功后才发布正式标签。
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ needs.prepare.outputs.labels }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,version=2,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,version=2,scope=docker-${{ matrix.arch }},mode=max,ignore-error=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  merge:
    name: Publish multi-platform image
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image }}
      IMAGE_TAGS: ${{ needs.prepare.outputs.tags }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          shopt -s nullglob
          digests=(*)
          if (( ${#digests[@]} != 2 )); then
            echo "Expected digests for both amd64 and arm64." >&2
            exit 1
          fi

          tags=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tags+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          if (( ${#tags[@]} == 0 )); then
            echo "No image tags were generated." >&2
            exit 1
          fi

          docker buildx imagetools create "${tags[@]}" \
            "${digests[@]/#/${IMAGE_NAME}@sha256:}"

      - name: Verify published platforms
        run: |
          docker buildx imagetools inspect --raw "${IMAGE_TAGS%%$'\n'*}" |
            jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] |
              contains(["linux/amd64", "linux/arm64"])'

          printf '### Published Docker images\n\n' >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r tag; do
            printf -- '- %s\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$IMAGE_TAGS"
